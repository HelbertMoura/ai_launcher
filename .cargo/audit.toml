# cargo-audit configuration.
#
# Read by `cargo audit --file src-tauri/Cargo.lock` (npm run rust:audit and the
# quality.yml cargo-audit job), which runs from the repository root. cargo-audit
# looks for this file at `.cargo/audit.toml` relative to the working directory,
# so it must stay here — not at the repository root.
#
# CI runs the audit with `--deny warnings`, so every known advisory that is a
# deliberate, reviewed acceptance MUST be listed here with a reason. When a
# dependency upgrade removes one of these, remove its entry too.
#
# None of the entries below is a vulnerability with a known exploit path in
# AI Launcher: they are unmaintained/unsound notices in transitive dependencies
# of the Tauri/GTK/regex stacks, to be dropped as those stacks upgrade.

[advisories]
ignore = [
    # fxhash 0.1 (transitive, unmaintained) — pull via tauri/ct-lexer stack; no
    # security-relevant code path, waiting on upstream replacement (rustc-hash).
    "RUSTSEC-2025-0057",
    # proc-macro-error 1.0 (transitive, unmaintained) — build-time helper used
    # by derive macros in the dependency tree; unmaintained but not unsound.
    "RUSTSEC-2024-0370",
    # unic-* 0.9 family (transitive, unmaintained) — Unicode tables pulled by
    # regex/tera text processing; frozen tables, no runtime risk.
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0100", # unic-ucd-ident
    "RUSTSEC-2025-0098", # unic-ucd-version
    # event-listener 5.4 (unsound) — `!Send` tag crossing via StackSlot;
    # requires a race pattern our single-waker usage does not hit. Fixed
    # upstream; bump when event-listener publishes the patched release.
    "RUSTSEC-2026-0221",
    # glib 0.18 (unsound) — VariantStrIter iterator impls; Linux (GTK) only,
    # and the affected iterator wrapper is not used by our code paths.
    "RUSTSEC-2024-0429",
    # rand 0.7 (unsound) — legacy line kept alive by a transitive dep; the
    # advisory requires a custom global logger overriding rand::rng(), which
    # this app never installs. Superseded by rand 0.8+ elsewhere in the tree.
    "RUSTSEC-2026-0097",
]
