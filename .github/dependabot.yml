version: 2

# Atualizações automáticas de dependências. Agrupa minor/patch pra não gerar
# PR spam. Major também é agrupado mas em PR separado (e a cada 2 semanas, não
# toda semana) para que major upgrades de React/Vite/Tauri entrem no radar
# sem virar ruído. Major updates individuais podem quebrar build, então a
# revisão humana é mandatória antes do merge.

updates:
  # npm (frontend)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: deps
      include: scope
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      frontend-dev:
        applies-to: version-updates
        dependency-type: development
      # Major upgrades agrupados (React 19 -> 20, Vite 8 -> 9, Tauri API 2 -> 3).
      # Frequency bi-weekly para não saturar a fila; open-pull-requests-limit
      # menor para forçar resolução antes de acumular.
      frontend-major:
        applies-to: version-updates
        update-types:
          - major
        frequency: "fortnightly"

  # cargo (Rust backend)
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: deps
      include: scope
    groups:
      rust-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      rust-major:
        applies-to: version-updates
        update-types:
          - major
        frequency: "fortnightly"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope
    groups:
      # Actions majors geralmente são breaking mas baixa disrupção (GitHub
      # mantém compatibilidade de flags razoavelmente bem). Mensal mantém
      # o ritmo sem empilhar PRs.
      actions-major:
        applies-to: version-updates
        update-types:
          - major
        frequency: "monthly"
