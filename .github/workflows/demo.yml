name: Demo GIF

# Records the README demo GIF on demand. The GIF is NOT committed here:
# download the ai-launcher-demo-gif artifact and commit it at docs/demo.gif
# (same canonical flow as the visual-baseline snapshot refresh).
on:
  workflow_dispatch:

concurrency:
  group: demo-gif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Record README demo GIF
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install deps
        run: npm ci --legacy-peer-deps
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: Install ffmpeg (not preinstalled on windows runners)
        shell: pwsh
        run: choco install ffmpeg --yes --no-progress
      - name: Record demo and encode GIF
        run: node scripts/record-demo.mjs
      - name: Upload demo GIF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-launcher-demo-gif
          path: docs/demo.gif
          if-no-files-found: error
          retention-days: 7
      - name: Upload raw video on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-launcher-demo-video-debug
          path: test-results/demo-video/*.webm
          if-no-files-found: ignore
          retention-days: 3
