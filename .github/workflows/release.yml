name: release

# Dispara quando uma tag `v*` é pushada. Três jobs em paralelo — Windows
# (MSI + NSIS + latest.json do updater), macOS (DMG aarch64 + x86_64) e Linux
# (AppImage + deb) — e todos anexam os bundles ao MESMO release da tag
# (cria o release se ainda não existir).
#
# Signing opcional: configure os secrets `SIGNING_CERT_BASE64` e
# `SIGNING_CERT_PASSWORD` em Settings → Secrets and variables → Actions pra
# que os binários sejam assinados e o SmartScreen deixe de alertar.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag para anexar (ex: v5.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify release readiness
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: npm run release:readiness

      - name: Clean stale bundle artifacts
        shell: pwsh
        run: |
          Remove-Item -Path src-tauri/target/release/bundle -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path latest.json -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path src-tauri/target/release -Filter "*.sha256" -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force

      - name: Build Tauri bundle (MSI + NSIS)
        run: npm run tauri build

      # Signing é opt-in — só roda se o secret existir. Sem o secret, os
      # binários saem sem assinatura e os usuários verão o aviso SmartScreen.
      - name: Sign binaries (opt-in)
        if: env.SIGNING_CERT_BASE64 != ''
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String($env:SIGNING_CERT_BASE64)
          $certPath = "$env:RUNNER_TEMP\code-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -Include *.msi,*-setup.exe | ForEach-Object {
            & $signtool.FullName sign /f $certPath /p $env:SIGNING_CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $_.FullName
          }

      - name: Prepare release notes
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $notes = "docs/releases/$tag.md"
          if (Test-Path $notes) {
            Copy-Item $notes release-body.md
          } else {
            @("AI Launcher $tag", "", "See CHANGELOG.md for details.") | Set-Content -Path release-body.md -Encoding utf8
          }

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2.3.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-body.md
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -Include *.msi,*-setup.exe | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.DirectoryName)/$($_.Name).sha256" -Encoding utf8
          }

      # Sign the NSIS installer with the tauri updater key. The signature is
      # required by tauri-plugin-updater; without it the updater refuses the
      # payload. The step itself is skipped when the private key is not
      # configured, but that is NOT a silent path anymore: the latest.json
      # step below hard-fails without a key/signature (fail-closed), so an
      # unsigned release can never ship.
      - name: Sign NSIS installer (opt-in)
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $nsis = (Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *-setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1)
          if ($nsis) {
            $signature = npx tauri signer sign $nsis.FullName 2>&1 | Out-String
            Write-Host "Signature generated for $($nsis.Name):`n$signature"
            # tauri signer prints "<base64>" on the last line.
            $sigBytes = ($signature -split "`n" | Where-Object { $_ -match '^[A-Za-z0-9+/=]{20,}$' } | Select-Object -Last 1)
            if ($sigBytes) {
              $sigBytes | Out-File -FilePath "$($nsis.FullName).sig" -Encoding ascii -NoNewline
            } else {
              Write-Error "Could not extract signature from tauri signer output"
              exit 1
            }
          }

      # Fail-closed: the in-app updater refuses latest.json without a valid
      # signature, so publishing an unsigned manifest would brick updates.
      # Without the private key (or without the .sig produced above) this
      # step intentionally fails the release.
      - name: Generate latest.json (tauri-plugin-updater schema)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart('v')
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")

          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Error "TAURI_SIGNING_PRIVATE_KEY secret is not configured — refusing to publish an unsigned latest.json (fail-closed). Configure the Tauri updater signing key under Settings > Secrets and variables > Actions."
            exit 1
          }

          $nsis = (Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *-setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1)
          $nsisAssetName = if ($nsis) { $nsis.Name.Replace(' ', '.') } else { "" }
          $downloadUrl = if ($nsis) { "https://github.com/HelbertMoura/ai_launcher/releases/download/$tag/$nsisAssetName" } else { "" }

          # Plugin expects the signature as a base64 string, produced by the
          # "Sign NSIS installer" step above. A missing .sig here means the
          # updater would reject this manifest — fail the release instead.
          $signature = ""
          if ($nsis) {
            $sigPath = "$($nsis.FullName).sig"
            if (Test-Path $sigPath) {
              $signature = (Get-Content $sigPath -Raw).Trim()
            }
          }
          if ([string]::IsNullOrWhiteSpace($signature)) {
            Write-Error "Updater signature (.sig) is missing for the NSIS installer — refusing to publish latest.json without a valid signature (the in-app updater would reject it)."
            exit 1
          }

          $manifest = @{
            version = $version
            notes = "AI Launcher $tag — see https://github.com/HelbertMoura/ai_launcher/releases/tag/$tag"
            pub_date = $date
            url = $downloadUrl
            signature = $signature
          }

          $manifest | ConvertTo-Json -Depth 5 | Out-File -FilePath "latest.json" -Encoding utf8
          Write-Host "Generated latest.json for $tag (signature: $($signature.Length) chars)"

      - name: Attach checksums and latest.json to release
        uses: softprops/action-gh-release@v2.3.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            src-tauri/target/release/bundle/msi/*.sha256
            src-tauri/target/release/bundle/nsis/*.sha256
            latest.json
          overwrite_files: true

      - name: Audit release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/audit-release.sh
          bash scripts/audit-release.sh "${{ github.event.inputs.tag || github.ref_name }}"

  # macOS: dois DMGs (Apple Silicon e Intel), checksums sha256 por bundle.
  # Sem latest.json — o updater in-app é Windows-only (tauri-plugin-updater).
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Clean stale bundle artifacts
        run: rm -rf src-tauri/target/release/bundle src-tauri/target/aarch64-apple-darwin/release/bundle src-tauri/target/x86_64-apple-darwin/release/bundle
        shell: bash

      - name: Build DMG (Apple Silicon)
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles dmg

      - name: Build DMG (Intel)
        run: npm run tauri build -- --target x86_64-apple-darwin --bundles dmg

      - name: Generate SHA-256 checksums (DMGs)
        run: |
          for dmg in \
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg \
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg; do
            shasum -a 256 "$dmg" > "$dmg.sha256"
          done

      - name: Attach macOS DMGs to release
        uses: softprops/action-gh-release@v2.3.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg.sha256
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg.sha256
          fail_on_unmatched_files: true
          overwrite_files: true

  # Linux: AppImage + deb, checksums sha256 por bundle. Sem latest.json —
  # o updater in-app é Windows-only (tauri-plugin-updater).
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Clean stale bundle artifacts
        run: rm -rf src-tauri/target/release/bundle
        shell: bash

      # APPIMAGE_EXTRACT_AND_RUN lets the linuxdeploy AppImage self-extract on
      # runners without FUSE, which is how the official Tauri docs handle CI.
      - name: Build Tauri bundle (AppImage + deb)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri build -- --bundles appimage,deb

      - name: Generate SHA-256 checksums (AppImage + deb)
        run: |
          cd src-tauri/target/release/bundle
          for f in appimage/*.AppImage deb/*.deb; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Attach Linux bundles to release
        uses: softprops/action-gh-release@v2.3.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage.sha256
            src-tauri/target/release/bundle/deb/*.deb.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
