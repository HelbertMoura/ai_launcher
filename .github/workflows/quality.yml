name: Quality Gates

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_snapshots:
        description: "Regenerate visual-baseline snapshots (runner rendering) and upload them as an artifact"
        type: boolean
        default: false

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tsc:
    name: TypeScript (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install deps
        run: npm ci --legacy-peer-deps
      - name: Type-check
        run: npx tsc --noEmit

  vitest:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install deps
        run: npm ci --legacy-peer-deps
      - name: Run tests
        run: npm test

  npm-audit:
    name: npm dependency audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install deps
        run: npm ci --legacy-peer-deps
      - name: Production dependency audit
        run: npm run audit:prod
      - name: Full tooling dependency audit
        run: npm run audit:all
      - name: Tauri capability audit
        run: npm run audit:capabilities
      - name: Storage boundary audit
        run: npm run audit:storage

  cargo:
    name: Rust (clippy + test + fmt)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
      - name: Install frontend deps
        run: npm ci --legacy-peer-deps
      - name: Build frontend (required by tauri::generate_context!)
        run: npm run build
      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --no-deps -- -D warnings
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test

  cargo-linux:
    name: Rust on Linux (clippy + test + fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev
      - name: Install frontend deps
        run: npm ci --legacy-peer-deps
      - name: Build frontend (required by tauri::generate_context!)
        run: npm run build
      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --no-deps -- -D warnings
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test

  cargo-audit:
    name: Rust (cargo audit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Runs from the repo root so cargo-audit picks up .cargo/audit.toml
      # (documented advisory ignores). Any unmaintained/unsound notice not
      # ignored there now fails the build.
      - name: Audit (deny warnings)
        run: cargo audit --file src-tauri/Cargo.lock --deny warnings

  e2e:
    name: Playwright E2E
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install deps
        run: npm ci --legacy-peer-deps
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        if: ${{ inputs.refresh_snapshots != true }}
        run: npm run e2e
      - name: Refresh visual-baseline snapshots
        if: ${{ inputs.refresh_snapshots == true }}
        run: npx playwright test visual-baseline --update-snapshots
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload refreshed snapshots
        if: ${{ inputs.refresh_snapshots == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: refreshed-snapshots
          path: e2e/**/*-snapshots/**
          retention-days: 7

  build-metrics:
    name: Frontend build metrics
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install deps
        run: npm ci --legacy-peer-deps
      - name: Build frontend
        run: npm run build
      - name: Report bundle metrics
        run: npm run build:metrics | Tee-Object -FilePath build-metrics.json
      - name: Upload metrics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-build-metrics
          path: build-metrics.json
          retention-days: 30

  release-readiness:
    name: Release readiness contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install deps
        run: npm ci --legacy-peer-deps
      - name: Verify release readiness
        run: npm run release:readiness
