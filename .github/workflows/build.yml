name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify release readiness
        run: npm run release:readiness

      - name: Build frontend
        run: npm run build

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri bundle (MSI + NSIS)
        run: npm run tauri build

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-launcher-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-launcher-nsis
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 30

  macos:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Build DMG (Apple Silicon)
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles dmg

      - name: Build DMG (Intel)
        run: npm run tauri build -- --target x86_64-apple-darwin --bundles dmg

      - name: Upload DMG artifact (aarch64)
        uses: actions/upload-artifact@v7
        with:
          name: ai-launcher-dmg-aarch64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 30

      - name: Upload DMG artifact (x86_64)
        uses: actions/upload-artifact@v7
        with:
          name: ai-launcher-dmg-x86_64
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 30

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      # APPIMAGE_EXTRACT_AND_RUN lets the linuxdeploy AppImage self-extract on
      # runners without FUSE, which is how the official Tauri docs handle CI.
      - name: Build Tauri bundle (AppImage + deb)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri build -- --bundles appimage,deb

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-launcher-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30

      - name: Upload deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-launcher-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30

