# Template — preenchido por scripts/gen-package-manifests.mjs. O InstallerUrl
# aponta para o instalador NSIS (x64) anexado ao release da tag correspondente.
PackageIdentifier: DevManiacs.AILauncher
PackageVersion: {{VERSION}}
Platform:
- Windows.Desktop
MinimumOSVersion: 10.0.17763.0
InstallerType: nullsoft
InstallModes:
- interactive
- silent
- silentWithProgress
InstallerSwitches:
  Silent: /S
  SilentWithProgress: /S
  Upgrade: /S
UpgradeBehavior: install
ReleaseDate: {{RELEASE_DATE}}
Installers:
- Architecture: x64
  InstallerUrl: {{INSTALLER_URL}}
  InstallerSha256: {{SHA256}}
ManifestType: installer
ManifestVersion: 1.9.0
